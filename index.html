<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#090b10">
  <meta name="description" content="Demo privada de Gviso Web. Solicita acceso directo por WhatsApp.">
  <title>Demo no disponible · Gviso Web</title>
  <style>
    :root { color-scheme: dark; --ink:#f4f4f2; --muted:#a6acb8; --amber:#f2a93b; --blue:#377dff; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100svh; display:grid; place-items:center; padding:24px; overflow:hidden; background:#090b10; color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    body::before { content:""; position:fixed; inset:-30%; background:radial-gradient(circle at 35% 30%,rgba(55,125,255,.18),transparent 28%),radial-gradient(circle at 70% 65%,rgba(242,169,59,.14),transparent 28%); filter:blur(20px); pointer-events:none; }
    main { position:relative; width:min(100%,680px); padding:clamp(34px,7vw,68px); border:1px solid rgba(255,255,255,.12); border-radius:28px; background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.025)); box-shadow:0 28px 90px rgba(0,0,0,.42); text-align:center; backdrop-filter:blur(16px); }
    .mark { display:inline-grid; place-items:center; width:64px; height:64px; margin-bottom:28px; border-radius:19px; color:#090b10; font-weight:900; letter-spacing:-.08em; font-size:24px; background:linear-gradient(135deg,var(--amber),#ffd899 52%,var(--blue)); box-shadow:0 12px 38px rgba(242,169,59,.2); }
    .eyebrow { margin:0 0 14px; color:var(--amber); font-size:12px; font-weight:800; letter-spacing:.18em; text-transform:uppercase; }
    h1 { margin:0; font-size:clamp(34px,7vw,62px); line-height:.98; letter-spacing:-.055em; }
    p { max-width:500px; margin:24px auto 32px; color:var(--muted); font-size:clamp(17px,2.8vw,20px); line-height:1.55; }
    a { display:inline-flex; align-items:center; justify-content:center; min-height:54px; padding:0 24px; border-radius:999px; color:#0a0c10; background:var(--ink); font-weight:800; text-decoration:none; transition:transform .2s ease,background .2s ease; }
    a:hover { transform:translateY(-2px); background:#fff; }
    a:focus-visible { outline:3px solid var(--amber); outline-offset:4px; }
    footer { margin-top:30px; color:#6f7682; font-size:13px; }
    @media (prefers-reduced-motion:reduce) { a { transition:none; } }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">GV</div>
    <p class="eyebrow">Gviso Web</p>
    <h1>Esta demo no está disponible públicamente.</h1>
    <p>Si quieres verla o conversar sobre una web para tu negocio, contacta a Gustavo.</p>
    <a href="https://wa.me/34684249067?text=Hola%20Gustavo%2C%20quisiera%20ver%20la%20demo%20web" rel="noopener noreferrer">Solicitar acceso por WhatsApp</a>
    <footer>Diseño web, apps y automatizaciones.</footer>
  </main>
</body>
</html>
